services:
  litellm:
    container_name: "litellm-claude-code-proxy"
    image: "ghcr.io/berriai/litellm:v1.95.0"
    command:
      - "--config"
      - "/app/config.yaml"
      # Fixed internal port, like db's 5432. LITELLM_PORT governs only the
      # host side of the mapping below.
      - "--port"
      - "4000"
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    env_file:
      - ".env"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@db:5432/${POSTGRES_DB:-litellm}"
    volumes:
      - "./litellm_config.yaml:/app/config.yaml:ro"
      - "${HOME}/.config/litellm/github_copilot:/root/.config/litellm/github_copilot"
    depends_on:
      db:
        condition: "service_healthy"
      presidio-analyzer:
        condition: "service_healthy"
      presidio-anonymizer:
        condition: "service_healthy"
    restart: "unless-stopped"
    networks:
      - "litellm-cc-proxy"

  presidio-analyzer:
    container_name: "litellm-claude-code-proxy-presidio-analyzer"
    image: "mcr.microsoft.com/presidio-analyzer:2.2.362"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: "10s"
      timeout: "5s"
      retries: 12
      start_period: "60s"
    restart: "unless-stopped"
    networks:
      - "litellm-cc-proxy"

  presidio-anonymizer:
    container_name: "litellm-claude-code-proxy-presidio-anonymizer"
    image: "mcr.microsoft.com/presidio-anonymizer:2.2.362"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: "10s"
      timeout: "5s"
      retries: 12
      start_period: "20s"
    restart: "unless-stopped"
    networks:
      - "litellm-cc-proxy"

  db:
    container_name: "litellm-claude-code-proxy-db"
    image: "postgres:18-alpine"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-litellm}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-litellm}"
      POSTGRES_DB: "${POSTGRES_DB:-litellm}"
    volumes:
      - "pgdata:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm}"]
      interval: "5s"
      timeout: "5s"
      retries: 5
    restart: "unless-stopped"
    networks:
      - "litellm-cc-proxy"

volumes:
  pgdata:

networks:
  litellm-cc-proxy:
    name: "litellm-cc-proxy"
